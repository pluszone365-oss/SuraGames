<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%" fill="none">
  <!-- Telebirr Official Blue Symbol with Precision Vectors -->
  <g transform="translate(64, 64) scale(0.92) translate(-64, -64)">
    <!-- Top Flare & Horizontal Cross Wings -->
    <!-- Top point extending upward -->
    <path 
      d="M 64 8 C 64 24 72 38 88 44 L 64 44 C 64 44 64 28 64 8 Z" 
      fill="#0062D6" 
    />
    
    <!-- Left Wing Flare -->
    <path 
      d="M 18 44 C 36 44 48 52 52 68 L 52 44 L 18 44 Z" 
      fill="#0062D6" 
    />

    <!-- Upper Right Flare -->
    <path 
      d="M 64 26 C 68 38 82 44 104 44 L 64 44 Z" 
      fill="#0062D6" 
    />

    <!-- Main Dynamic Crossbar -->
    <rect x="22" y="44" width="82" height="13.5" rx="3" fill="#0062D6" />

    <!-- Sweeping Spiral Wave (Telecom Frequency & Birr Symbol) -->
    <!-- Outer Swirl Arc flowing down and around -->
    <path 
      d="M 60 52 
         C 60 76 60 88 64 98 
         C 70 114 88 120 102 108 
         C 114 96 112 78 98 70 
         C 84 64 74 74 76 86 
         C 78 96 88 100 96 94 
         C 102 88 100 80 94 79 
         C 90 78 88 82 90 85" 
      stroke="#0062D6" 
      stroke-width="12" 
      stroke-linecap="round" 
      stroke-linejoin="round" 
      fill="none" 
    />

    <!-- Sharp Decorative Inner Accents -->
    <path 
      d="M 44 44 C 44 58 52 70 64 72 L 64 56 C 54 54 48 48 44 44 Z" 
      fill="#0052B4" 
      opacity="0.3"
    />
  </g>
</svg>
