<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%" fill="none">
  <!-- eBirr Official Emerald Green Circular Emblem -->
  <defs>
    <linearGradient id="ebirrBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F9945" />
      <stop offset="100%" stop-color="#067833" />
    </linearGradient>
  </defs>

  <!-- Outer Solid Disc -->
  <circle cx="64" cy="64" r="62" fill="url(#ebirrBgGrad)" />

  <g transform="translate(64, 48) scale(0.92) translate(-64, -48)">
    <!-- Stylized Smartphone Terminal Frame in White with Top-Right Antenna Notch -->
    <path 
      d="M 45 22 
         C 40 22 36 26 36 31 
         L 36 67 
         C 36 72 40 76 45 76 
         L 77 76 
         C 82 76 86 72 86 67 
         L 86 35 
         C 86 32 87 31 89 31 
         L 89 25 
         C 89 23 87 22 85 22 
         L 81 22 
         L 81 22 
         C 79 22 78 23 78 25 
         L 78 26 
         C 78 28 76 29 74 29 
         L 45 29 
         C 42 29 40 27 40 25 
         C 40 23 42 22 45 22 Z" 
      fill="#FFFFFF" 
    />

    <!-- Inner Terminal Cutout / Display -->
    <rect x="42" y="32" width="38" height="38" rx="6" fill="#0F9945" />

    <!-- Stylized 'e' Mark Inside Terminal -->
    <!-- Lower bowl of the 'e' -->
    <path 
      d="M 68 53 
         L 51 53 
         C 51 46 56 41 61 41 
         C 66 41 70 45 70 49 
         L 70 51 
         L 56 51 
         C 56 46 58 44 61 44 
         C 63 44 65 46 65 48" 
      stroke="#FFFFFF" 
      stroke-width="3.2" 
      stroke-linecap="round" 
      stroke-linejoin="round" 
      fill="none" 
    />
    <path 
      d="M 51 51 
         C 51 57 55 62 61 62 
         C 66 62 69 59 70 56" 
      stroke="#FFFFFF" 
      stroke-width="3.2" 
      stroke-linecap="round" 
      fill="none" 
    />
  </g>

  <!-- 'ebirr' Modern Rounded Lowercase Wordmark -->
  <g transform="translate(64, 88) scale(0.98) translate(-64, -88)" fill="#FFFFFF">
    <!-- 'e' -->
    <g transform="translate(29, 78)">
      <circle cx="6" cy="6" r="5" stroke="#FFFFFF" stroke-width="2.5" fill="none" />
      <path d="M 1 6 L 11 6" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" />
      <path d="M 11 6 C 11 2.5 8.5 1 6 1 C 2.5 1 1 3.5 1 6 C 1 9 3 11 6 11 C 9 11 10.5 9.5 11 8" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" fill="none" />
    </g>

    <!-- 'b' -->
    <g transform="translate(44, 73)">
      <rect x="1" y="0" width="2.4" height="16" rx="1.2" />
      <circle cx="7" cy="11" r="5" stroke="#FFFFFF" stroke-width="2.2" fill="none" />
    </g>

    <!-- 'i' -->
    <g transform="translate(60, 75)">
      <circle cx="2" cy="1.5" r="1.5" />
      <rect x="0.8" y="5" width="2.4" height="9" rx="1.2" />
    </g>

    <!-- 'r' -->
    <g transform="translate(69, 80)">
      <rect x="1" y="0" width="2.4" height="9" rx="1.2" />
      <path d="M 2.5 2.5 C 4 1 6.5 1 8 2.5" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" fill="none" />
    </g>

    <!-- 'r' -->
    <g transform="translate(81, 80)">
      <rect x="1" y="0" width="2.4" height="9" rx="1.2" />
      <path d="M 2.5 2.5 C 4 1 6.5 1 8 2.5" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" fill="none" />
    </g>
  </g>

  <!-- Micro Sub-tagline bar "Electronic Payment" -->
  <rect x="42" y="103" width="44" height="1.8" rx="0.9" fill="#A7F3D0" opacity="0.8" />
  <circle cx="38" cy="103.9" r="1.2" fill="#A7F3D0" opacity="0.8" />
  <circle cx="90" cy="103.9" r="1.2" fill="#A7F3D0" opacity="0.8" />
</svg>
